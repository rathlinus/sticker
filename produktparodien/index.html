<style>
  :root { color-scheme: dark; --bg: #1a1a19; --card: #262624; --fg: #ececea; --muted: #a2a29a; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; padding: 24px 16px 64px; }
  header { margin: 0 0 20px; }
  h1 { font-size: 26px; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  figure { margin: 0; background: var(--card); border-radius: 6px; overflow: hidden; }
  figure img { display: block; width: 100%; height: 300px; object-fit: contain; background: #111; }
  figcaption { padding: 8px 12px 10px; }
  figcaption span { color: var(--muted); }
  figcaption { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  figcaption .dl { margin-left: auto; }
  a.dl { font-size: 14px; color: var(--fg); }
  button { font: inherit; font-size: 14px; color: var(--fg); background: #3a3a37; border: 1px solid #55554f; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  button:hover { background: #4a4a46; }
  button:disabled { opacity: .6; cursor: default; }
  #msg { color: var(--muted); font-size: 14px; margin-left: 8px; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
  const msg = document.getElementById("msg");
  const all = document.getElementById("all");
  if (typeof JSZip === "undefined") { all.hidden = true; return; }
  all.addEventListener("click", async () => {
    all.disabled = true;
    try {
      const zip = new JSZip();
      const links = [...document.querySelectorAll("a.dl")];
      let n = 0;
      for (const a of links) {
        const r = await fetch(a.getAttribute("href"));
        if (!r.ok) throw new Error(a.getAttribute("href"));
        zip.file(a.getAttribute("download"), await r.blob());
        msg.textContent = "Packe " + (++n) + " von " + links.length + " …";
      }
      const url = URL.createObjectURL(await zip.generateAsync({ type: "blob" }));
      const dl = document.createElement("a");
      dl.href = url; dl.download = "produktparodien.zip";
      document.body.append(dl); dl.click(); dl.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      msg.textContent = "";
    } catch (e) { msg.textContent = "Download geht gerade nicht."; }
    all.disabled = false;
  });
})();
</script>
